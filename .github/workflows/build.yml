name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ---- BƯỚC THÊM MỚI: Giải mã file JKS từ GitHub Secrets ----
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks

      # ---- SỬA ĐỔI: Chuyển từ assembleDebug sang assembleRelease ----
      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show errors in summary
        if: failure()
        run: |
          echo "## ❌ Build failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> \$GITHUB_STEP_SUMMARY
          grep -E "^e: |^error:|error:|FAILURE:|Caused by:|> Task .* FAILED" build.log | head -80 >> \$GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      # ---- SỬA ĐỔI: Upload file APK Release thay vì bản Debug ----
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SwarmWallpaper-apk
          path: app/build/outputs/apk/release/app-release.apk
