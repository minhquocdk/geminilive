name: Generate JKS Keystore (Run Once)

on:
  workflow_dispatch: # Cho phép bấm nút chạy thủ công từ giao diện GitHub

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JKS and Output Base64
        run: |
          # 1. Tạo file release.jks ngẫu nhiên
          keytool -genkeypair -v \
            -keystore my-release-key.jks \
            -alias my-alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "MySecurePassword123!" \
            -keypass "MySecurePassword123!" \
            -dname "CN=AndroidApp, OU=IT, O=Company, L=HCM, C=VN"

          echo "================================================================="
          echo "ĐÂY LÀ CHUỖI BASE64 CỦA FILE JKS BẠN VỪA TẠO:"
          echo "Hãy Copy toàn bộ chuỗi dưới đây dán vào Settings -> Secrets -> KEYSTORE_BASE64"
          echo "================================================================="
          
          # 2. Chuyển thành Base64 và in ra màn hình Log
          base64 -w 0 my-release-key.jks
          echo ""
